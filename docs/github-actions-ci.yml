name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        working-directory: bilibili-memory
        run: python -m unittest discover -s tests -v

      - name: Check Node.js syntax
        run: |
          node --check bilibili-memory/admin/server.mjs
          node --check local-embedding/server.mjs
          node --check tools/start-maibot-services.mjs
          node --check tools/stop-maibot-services.mjs
